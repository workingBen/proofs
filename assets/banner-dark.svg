<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" width="720" height="450" role="img" aria-labelledby="t d">
<title id="t">Claude skills that show their work.</title>
<desc id="d">Skills for Claude Code. Four decision buttons: Keep original, Use selected, Approve with comment, Request revision.</desc>
