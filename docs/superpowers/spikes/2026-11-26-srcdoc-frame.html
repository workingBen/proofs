<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Srcdoc frame spike</title>
<style>
  :root{color-scheme:light dark;--bg:#fff;--fg:#111;--line:#bbb;--pass:#0a7a2f;--fail:#c00}
  @media (prefers-color-scheme:dark){:root{--bg:#161616;--fg:#f2f2f2;--line:#555;--pass:#4cd078;--fail:#ff6b6b}}
  *{box-sizing:border-box}
  body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font:18px/1.4 system-ui,sans-serif;max-width:100%;overflow-x:hidden}
  h1{font-size:24px;margin:0 0 8px}
  button{font:inherit;font-size:20px;padding:14px 18px;min-height:48px;width:100%;margin:8px 0;border:2px solid var(--fg);background:transparent;color:var(--fg);border-radius:8px}
  .report{font-size:22px;font-weight:600;margin:8px 0;word-break:break-word}
  .pass{color:var(--pass)}.fail{color:var(--fail)}
  .box{border:1px solid var(--line);padding:8px;margin:12px 0}
  .stage{position:relative;overflow:hidden;border:1px solid var(--line);margin:8px 0}
  .stage iframe{border:0;position:absolute;top:0;left:0;transform-origin:0 0;background:#fff}
</style></head><body>
<h1>Srcdoc frame spike</h1>
<p>Two frames, 1280 and 390 wide. Inside each, a heading is <b>green</b> on a wide frame and <b>red</b> on a narrow one (600 px media query). The toggle sets a data attribute that turns it <b>purple</b>.</p>
<button id="toggle" type="button">Toggle data-rc="c1" on both</button>
<button id="t1280" type="button">Toggle c1 on 1280 only</button>
<button id="t390" type="button">Toggle c1 on 390 only</button>
<button id="c2" type="button">Set data-rc="c2" on both</button>
<button id="c1c2" type="button">Set data-rc="c1 c2" on both</button>
<div id="checks" class="box" aria-live="polite"></div>
<div id="reports" class="box"></div>
<p>Frame 1280 (scaled to fit)</p>
<div class="stage" id="stage1280"><iframe id="f1280" width="1280" height="200" title="1280 frame"></iframe></div>
<p>Frame 390</p>
<div class="stage" id="stage390" style="width:390px;max-width:100%;height:200px"><iframe id="f390" width="390" height="200" title="390 frame"></iframe></div>
<script>
const INNER = '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">' +
  '<style>body{margin:0;padding:12px;font:20px system-ui,sans-serif;color:#000;background:#fff}' +
  'h1{color:rgb(0, 128, 0);font-size:40px;margin:0}' +
  '@media (max-width:600px){h1{color:rgb(200, 0, 0)}}' +
  'html[data-rc~="c1"] h1{color:rgb(128, 0, 128)}</style></head>' +
  '<body><h1 id="h">Heading</h1><p>Inner page</p></body></html>';
const GREEN = "rgb(0, 128, 0)", RED = "rgb(200, 0, 0)", PURPLE = "rgb(128, 0, 128)";
const frames = { "1280": document.getElementById("f1280"), "390": document.getElementById("f390") };
const rc = { "1280": "", "390": "" };   // what we last set on each frame
const ready = { "1280": false, "390": false };
const BASE = { "1280": GREEN, "390": RED };
const NOLOAD = new URLSearchParams(location.search).get("noload"); // test hook: skip srcdoc on that frame

function fit() {
  const stage = document.getElementById("stage1280");
  const s = Math.min(1, stage.clientWidth / 1280);
  frames["1280"].style.transform = "scale(" + s + ")";
  stage.style.height = Math.ceil(200 * s) + "px";
}
function colorOf(k) {
  if (!ready[k]) return "NOT LOADED";
  try { return getComputedStyle(frames[k].contentDocument.getElementById("h")).color; }
  catch (e) { return "ERROR " + e.name; }
}
function widthOf(k) { try { return ready[k] ? frames[k].contentWindow.innerWidth : "NOT LOADED"; } catch (e) { return "ERROR " + e.name; } }
function line(ok, text) { return '<div class="report ' + (ok ? "pass" : "fail") + '">' + (ok ? "PASS" : "FAIL") + ": " + text + "</div>"; }
function expected(k) { return rc[k].split(/\s+/).indexOf("c1") >= 0 ? PURPLE : BASE[k]; }
function render() {
  const c = { "1280": colorOf("1280"), "390": colorOf("390") };
  document.getElementById("reports").innerHTML =
    '<div class="report" id="r1280">1280 frame color: ' + c["1280"] + '</div>' +
    '<div class="report" id="r390">390 frame color: ' + c["390"] + '</div>' +
    '<div class="report" id="rstate">data-rc: 1280=[' + rc["1280"] + '] 390=[' + rc["390"] + ']</div>';
  let h = "";
  for (const k of ["1280", "390"]) {
    h += line(ready[k], k + " frame loaded") +
         line(widthOf(k) === Number(k), k + " frame inner width is " + widthOf(k)) +
         line(c[k] === expected(k), k + " frame expected " + expected(k));
  }
  h += line(document.documentElement.scrollWidth <= document.documentElement.clientWidth, "no sideways page scroll");
  document.getElementById("checks").innerHTML = h;
}
function setRc(k, v) {
  rc[k] = v;
  try { frames[k].contentDocument.documentElement.setAttribute("data-rc", v); } catch (e) {}
}
const has = (k) => rc[k].split(/\s+/).indexOf("c1") >= 0;
function bind(id, fn) { document.getElementById(id).addEventListener("click", () => { fn(); render(); }); }
bind("toggle", () => { const v = has("1280") && has("390") ? "" : "c1"; setRc("1280", v); setRc("390", v); });
bind("t1280", () => setRc("1280", has("1280") ? "" : "c1"));
bind("t390", () => setRc("390", has("390") ? "" : "c1"));
bind("c2", () => { setRc("1280", "c2"); setRc("390", "c2"); });
bind("c1c2", () => { setRc("1280", "c1 c2"); setRc("390", "c1 c2"); });
for (const k of Object.keys(frames)) frames[k].addEventListener("load", () => { ready[k] = true; render(); });
for (const k of Object.keys(frames)) if (NOLOAD !== k) frames[k].srcdoc = INNER;
window.addEventListener("resize", fit); fit();
render();                      // at once, so a frame that never loads shows FAIL, not a blank
setTimeout(render, 2000);      // fallback: report whatever loaded
</script></body></html>
