<rect x="368" y="282" width="308" height="60" rx="30" fill="#ff8a4c"/>
<text x="522.0" y="320" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="600" fill="#15130f">Use selected</text>
