<title>proofs · %%SKILL%%</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#f4efe6; --card:#fffdf9; --fg:#1d1b17; --muted:#6b6458; --line:#ddd5c6; --soft:#ece5d8; --sk:#e2dacb; --skd:#c9bfad;
  --accent:#c2410c; --accent-soft:#fde4d6; --ok:#1a7f37; --ok-soft:#dcf5e3; --bad:#b42318; --bad-soft:#fde8e6;
  --mid:#8a5a00; --mid-soft:#fbefd2; --ink:#1d1b17; --paper:#f4efe6;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15130f; --card:#1e1b16; --fg:#efe8dc; --muted:#a69d8e; --line:#3a352c; --soft:#2a261f; --sk:#38332a; --skd:#524a3d;
  --accent:#ff8a4c; --accent-soft:#3a2216; --ok:#4ac26b; --ok-soft:#14281a; --bad:#ff6b5e; --bad-soft:#341815;
  --mid:#e0b14a; --mid-soft:#2f2612; --ink:#efe8dc; --paper:#15130f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15130f; --card:#1e1b16; --fg:#efe8dc; --muted:#a69d8e; --line:#3a352c; --soft:#2a261f; --sk:#38332a; --skd:#524a3d;
  --accent:#ff8a4c; --accent-soft:#3a2216; --ok:#4ac26b; --ok-soft:#14281a; --bad:#ff6b5e; --bad-soft:#341815;
  --mid:#e0b14a; --mid-soft:#2f2612; --ink:#efe8dc; --paper:#15130f; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:24px}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.in{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit}
.top{border-bottom:1px solid var(--line)}
.top .in{display:flex;align-items:center;gap:10px;padding-block:14px;font:600 13px "JetBrains Mono",monospace;color:var(--muted)}
.top .logo{color:var(--fg);font:400 22px "Instrument Serif",Georgia,serif;text-decoration:none}
.top .logo i{color:var(--accent)}
.hero .in{padding-block:48px 36px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.eyebrow{font:600 12px/1 "JetBrains Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.hero h1{font:400 clamp(40px,7vw,76px)/1 "Instrument Serif",Georgia,serif;margin:0;letter-spacing:-.01em}
.hero .tagline{font:400 clamp(22px,3vw,30px)/1.25 "Instrument Serif",Georgia,serif;margin:0;max-width:30em;text-wrap:balance}
.hero .use{color:var(--muted);max-width:44em;margin:0}
.try{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;max-width:760px;margin-top:6px}
.try .lbl{font:600 11px "JetBrains Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.trybox{display:flex;gap:10px;align-items:center;background:var(--ink);color:var(--paper);border-radius:10px;padding:12px 12px 12px 16px}
.trybox code{flex:1;min-width:0;font:14px/1.5 "JetBrains Mono",monospace}
.trybox button{flex:none;font:700 13px -apple-system,sans-serif;padding:10px 14px;min-height:40px;border-radius:7px;border:0;background:var(--accent);color:#fff;cursor:pointer}
.stats{display:flex;flex-wrap:wrap;gap:8px 20px;font:600 13px "JetBrains Mono",monospace;color:var(--muted)}
.stats b{color:var(--fg)}
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:40px;padding-block:24px 96px}
nav.toc{position:sticky;top:20px;align-self:start;max-height:calc(100vh - 40px);overflow:auto;font-size:14px}
.toc h2{font:600 11px "JetBrains Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.toc ol{list-style:none;margin:0;padding:0}
.toc > ol > li{margin-bottom:12px}
.toc > ol > li > a{font-weight:700;text-decoration:none}
.toc ol ol{margin-top:4px;border-left:2px solid var(--line);padding-left:10px;counter-reset:none}
.toc ol ol a{display:block;padding:3px 0;color:var(--muted);text-decoration:none;line-height:1.35}
.toc a:hover,.toc a.on{color:var(--accent)}
.toc ol ol a.on{font-weight:600}
.sec{display:grid;gap:18px;margin-bottom:48px}
.sec h2{display:flex;gap:12px;align-items:baseline;font:400 40px/1.1 "Instrument Serif",Georgia,serif;margin:0 0 4px;border-bottom:1px solid var(--line);padding-bottom:12px}
.sec h2 span{font:600 13px "JetBrains Mono",monospace;color:var(--accent)}
.feat{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:28px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 24px}
.fx{display:grid;gap:6px;min-width:0}
.fn{font:600 12px "JetBrains Mono",monospace;color:var(--accent)}
.fx h3{margin:0;font:400 34px/1.05 "Instrument Serif",Georgia,serif;text-wrap:balance}
.fx .sub{margin:0 0 4px;font-size:18px;font-weight:650;line-height:1.35;text-wrap:balance}
.fx p{margin:0;color:var(--muted)}
.fx p.sub{color:var(--fg)}
.fig{min-width:0;background:var(--soft);border-radius:12px;padding:16px;font-size:12px}
/* drawing kit */
.mk{display:block;background:var(--sk);border-radius:4px}
.mk.d{background:var(--skd)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two.mid{align-items:center}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.four{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.col{display:grid;gap:7px;align-content:start}
.row{display:flex;gap:6px;align-items:center}
.row.wrap{flex-wrap:wrap}
.opt{position:relative;background:var(--card);border:1.5px solid var(--line);border-radius:9px;padding:9px;display:grid;gap:5px;align-content:start}
.opt.sm{padding:6px}
.opt.sel{border:2px solid var(--accent)}
.opt.old{opacity:.5;border-style:dashed}
.opt.brand{border-color:var(--accent)}
.ck{position:absolute;top:6px;right:6px;width:18px;height:18px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center}
.tag{font:600 10px "JetBrains Mono",monospace;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.tag.acc,.acc{color:var(--accent)}
.mb{font:600 11.5px -apple-system,sans-serif;padding:7px 9px;border-radius:7px;border:1px solid var(--line);background:var(--card);white-space:nowrap}
.mb.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.mb.on.acc{background:var(--accent);border-color:var(--accent);color:#fff}
.mb.sm{padding:5px 8px}
.win{position:relative;background:var(--card);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.wb{display:flex;gap:4px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line);font:600 10px "JetBrains Mono",monospace;color:var(--muted)}
.wb i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.wb span{margin-left:6px}
.wbody{padding:10px;display:grid;gap:7px}
.cam{position:absolute;right:8px;bottom:8px;display:flex;gap:4px;align-items:center;font:600 10px "JetBrains Mono",monospace;background:var(--ink);color:var(--paper);padding:4px 7px;border-radius:999px}
.sw{display:flex;gap:5px}
.sw b{width:22px;height:22px;border-radius:5px;border:1px solid var(--line)}
.aa{font:400 30px/1 "Instrument Serif",Georgia,serif}
.aa small{font:600 10px "JetBrains Mono",monospace;color:var(--muted);margin-left:6px}
.hl{font:600 12px -apple-system,sans-serif;display:flex;gap:4px;align-items:center}
.hl.strike{text-decoration:line-through;color:var(--muted)}
.hl.ok{color:var(--ok)}
.pg{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px;display:grid;gap:6px;max-width:300px;margin:0 auto;width:100%}
.band{display:flex;gap:8px;align-items:center;border:1px dashed var(--line);border-radius:6px;padding:8px}
.num{flex:none;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font:700 11px/20px -apple-system,sans-serif;text-align:center}
.rec{font:600 10.5px "JetBrains Mono",monospace;padding:3px 7px;border-radius:999px;margin-left:auto}
.rec.yes{background:var(--ok-soft);color:var(--ok)} .rec.no{background:var(--bad-soft);color:var(--bad)}
.hd{font:600 12.5px -apple-system,sans-serif}
.why{font-size:12px;background:var(--card);border:1px solid var(--line);border-radius:7px;padding:7px 9px}
.phone{background:var(--card);border:1.5px solid var(--skd);border-radius:14px;padding:9px 7px;display:grid;gap:5px;max-width:84px;width:100%;justify-self:center}
.desk{background:var(--card);border:1.5px solid var(--skd);border-radius:7px;padding:9px}
.openi{display:flex;gap:7px;align-items:center;font:600 12px -apple-system,sans-serif;background:var(--card);border:1.5px solid var(--accent);border-radius:7px;padding:8px 10px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.recap{font:600 11px "JetBrains Mono",monospace;color:var(--muted);border:1px solid var(--line);border-radius:7px;padding:7px 10px}
.cbox{position:relative;background:var(--card);border:1.5px solid var(--accent);border-radius:7px;padding:9px 10px;font:12.5px -apple-system,sans-serif}
.caret{display:inline-block;width:1.5px;height:13px;background:var(--accent);vertical-align:-2px;margin-left:2px}
.pill{font:600 10.5px "JetBrains Mono",monospace;padding:3px 8px;border-radius:999px;margin-left:auto}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.mid{background:var(--mid-soft);color:var(--mid)} .pill.mute{background:var(--soft);color:var(--muted);border:1px solid var(--line)} .pill.line{border:1px solid var(--line);color:var(--muted);background:var(--card)}
.itm{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:7px;padding:8px 10px;font:600 12px -apple-system,sans-serif}
.itm span:first-child{flex:1}
.itm small{font:600 10px "JetBrains Mono",monospace;color:var(--muted)}
.tg{width:28px;height:16px;border-radius:9px;background:var(--line);position:relative}
.tg b{position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--card)}
.tg.on{background:var(--ok)} .tg.on b{left:14px}
.note2{font:600 10.5px "JetBrains Mono",monospace;color:var(--muted)}
.bottom{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--ink);color:var(--paper);border-radius:9px;padding:10px 12px;font:600 12px "JetBrains Mono",monospace}
.tally{display:flex;gap:5px}
.tally b{min-width:20px;text-align:center;border-radius:5px;padding:2px 5px;font-size:11px}
.tally .ok{background:var(--ok);color:#fff}.tally .mid{background:var(--mid);color:#fff}.tally .mute{background:var(--muted);color:#fff}
.ex{margin:0;font:11.5px/1.55 "JetBrains Mono",monospace;background:var(--card);border:1px solid var(--line);border-radius:7px;padding:10px;white-space:pre-wrap;word-break:break-word}
.flow{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:6px 8px}
.st{font:600 11px -apple-system,sans-serif;padding:3px 8px;border-radius:999px}
.st.ok{background:var(--ok-soft);color:var(--ok)}.st.mid{background:var(--mid-soft);color:var(--mid)}.st.mute{background:var(--soft);color:var(--muted)}
.arr{margin-left:auto;font:600 11px "JetBrains Mono",monospace;color:var(--muted)}
.ph{font:600 11px -apple-system,sans-serif;color:var(--muted);font-style:italic}
.code{display:grid;gap:3px;background:var(--ink);color:var(--paper);border-radius:8px;padding:10px;font:11px/1.4 "JetBrains Mono",monospace}
.chk span{display:flex;gap:6px;align-items:center;font:600 12px -apple-system,sans-serif;color:var(--ok)}
.link{font:600 10.5px "JetBrains Mono",monospace;color:var(--accent);border:1px dashed var(--accent);border-radius:999px;padding:3px 8px;width:fit-content}
.bub{background:var(--card);border:1px solid var(--line);border-radius:12px 12px 12px 3px;padding:8px 12px;font:italic 13px Georgia,serif;width:fit-content}
.pn .in{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-block:0 40px}
.pn a{display:grid;gap:4px;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.pn a span{font:600 11px "JetBrains Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.pn a b{font:400 26px/1.1 "Instrument Serif",Georgia,serif}
.pn a.nx{text-align:right}
.foot{border-top:1px solid var(--line);color:var(--muted);font-size:14px}
.foot .in{padding-block:28px;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between}
@media (max-width:900px){
  .layout{grid-template-columns:1fr;gap:16px}
  nav.toc{position:static;max-height:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .toc ol ol{display:none}
  .toc > ol{display:flex;flex-wrap:wrap;gap:6px}
  .toc > ol > li{margin:0}
  .toc > ol > li > a{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px}
  .feat{grid-template-columns:1fr;gap:16px;padding:18px}
}
@media (max-width:440px){.three{grid-template-columns:1fr 1fr}.three>.opt:nth-child(3){display:none}.four{grid-template-columns:1fr 1fr}.row.wrap .mb{font-size:11px}}
%%EXCSS%%</style>

<script>
(function(){
  var b=document.getElementById('tryb'),c=document.getElementById('tryc');
  b.addEventListener('click',function(){
    var done=function(){b.textContent='Copied';setTimeout(function(){b.textContent='Copy'},1500)};
    try{navigator.clipboard.writeText(c.textContent).then(done,function(){var r=document.createRange();r.selectNodeContents(c);var s=getSelection();s.removeAllRanges();s.addRange(r)})}catch(_){}
  });
  var links=[].slice.call(document.querySelectorAll('.toc a')),map={};
  links.forEach(function(a){map[a.getAttribute('href').slice(1)]=a});
  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting){links.forEach(function(a){a.classList.remove('on')});var a=map[en.target.id];if(a)a.classList.add('on')}})},{rootMargin:'-30% 0px -60% 0px'});
    document.querySelectorAll('.feat').forEach(function(f){io.observe(f)});
  }
})();
</script>
