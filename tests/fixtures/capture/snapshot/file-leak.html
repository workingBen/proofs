<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>File URL fixture</title>
<script>
  // A sheet from another site that names file: URLs: a local file must never be copied in.
  var far = document.createElement('link');
  far.rel = 'stylesheet';
  far.href = 'http://localhost:' + location.port + '/snapshot/file-leak.css';
  document.head.appendChild(far);
</script>
</head>
<body>
<p class="leak">A served page.</p>
<img id="own" src="file:///etc/hosts" alt="" width="1" height="1">
</body>
</html>
