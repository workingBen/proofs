<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 572" width="440" height="572" role="img" aria-labelledby="t d">
<title id="t">How every skill works</title><desc id="d">Four steps: 1 Claude shows you first. 2 Publishes a page. 3 You decide visually (highlighted). 4 Paste it back.</desc>
<rect width="440" height="572" rx="16" fill="#15130f"/>
<rect x="20" y="20" width="400" height="112" rx="12" fill="#1e1b16" stroke="#3a352c" stroke-width="1.5"/>
<text x="38" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#ff8a4c">01</text>
<text x="80" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="29" fill="#efe8dc">Claude shows you first</text>
<text x="80" y="90" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#a69d8e">Mockups and drafts,</text><text x="80" y="115" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#a69d8e">before anything changes.</text>
<path d="M220 137 v16 m-7 -7 l7 7 l7 -7" fill="none" stroke="#ff8a4c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="20" y="160" width="400" height="112" rx="12" fill="#1e1b16" stroke="#3a352c" stroke-width="1.5"/>
<text x="38" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#ff8a4c">02</text>
<text x="80" y="198" font-family="Georgia, 'Times New Roman', serif" font-size="29" fill="#efe8dc">Publishes a page</text>
<text x="80" y="230" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#a69d8e">A private review</text><text x="80" y="255" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#a69d8e">page, not chat.</text>
<path d="M220 277 v16 m-7 -7 l7 7 l7 -7" fill="none" stroke="#ff8a4c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="20" y="300" width="400" height="112" rx="12" fill="#3a2216" stroke="#ff8a4c" stroke-width="2.5"/>
<text x="38" y="336" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#ff8a4c">03</text>
<text x="80" y="338" font-family="Georgia, 'Times New Roman', serif" font-size="29" fill="#efe8dc">You decide visually</text>
<text x="80" y="370" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#a69d8e">Clear buttons and</text><text x="80" y="395" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#a69d8e">room for a comment.</text>
<path d="M220 417 v16 m-7 -7 l7 7 l7 -7" fill="none" stroke="#ff8a4c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="20" y="440" width="400" height="112" rx="12" fill="#1e1b16" stroke="#3a352c" stroke-width="1.5"/>
<text x="38" y="476" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#ff8a4c">04</text>
<text x="80" y="478" font-family="Georgia, 'Times New Roman', serif" font-size="29" fill="#efe8dc">Paste it back</text>
<text x="80" y="510" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#a69d8e">One Copy button.</text><text x="80" y="535" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#a69d8e">Claude does the rest.</text>
</svg>
