<text x="44" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="68" fill="#efe8dc">Claude skills that</text>
<text x="44" y="228" font-family="Georgia, 'Times New Roman', serif" font-size="68" fill="#efe8dc"><tspan font-style="italic" fill="#ff8a4c">show</tspan> their work.</text>
