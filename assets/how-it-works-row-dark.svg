<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 230" width="960" height="230" role="img" aria-labelledby="t d">
<title id="t">How every skill works</title><desc id="d">Four steps: 1 Claude shows you first. 2 Publishes a page. 3 You decide visually (highlighted). 4 Paste it back.</desc>
<rect width="960" height="230" rx="16" fill="#15130f"/>
<rect x="20" y="20" width="210" height="190" rx="12" fill="#1e1b16" stroke="#3a352c" stroke-width="1.5"/>
<text x="38" y="54" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#ff8a4c">01</text>
<text x="38" y="94" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#efe8dc">Claude shows</text><text x="38" y="126" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#efe8dc">you first</text>
<text x="38" y="162" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#a69d8e">Mockups and drafts,</text><text x="38" y="186" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#a69d8e">before it changes.</text>
<path d="M236 115 h18 m-7 -7 l7 7 l-7 7" fill="none" stroke="#ff8a4c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="260" y="20" width="210" height="190" rx="12" fill="#1e1b16" stroke="#3a352c" stroke-width="1.5"/>
<text x="278" y="54" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#ff8a4c">02</text>
<text x="278" y="94" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#efe8dc">Publishes</text><text x="278" y="126" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#efe8dc">a page</text>
<text x="278" y="162" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#a69d8e">A private review</text><text x="278" y="186" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#a69d8e">page, not chat.</text>
<path d="M476 115 h18 m-7 -7 l7 7 l-7 7" fill="none" stroke="#ff8a4c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="500" y="20" width="210" height="190" rx="12" fill="#3a2216" stroke="#ff8a4c" stroke-width="2.5"/>
<text x="518" y="54" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#ff8a4c">03</text>
<text x="518" y="94" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#efe8dc">You decide</text><text x="518" y="126" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#efe8dc">visually</text>
<text x="518" y="162" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#a69d8e">Clear buttons and</text><text x="518" y="186" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#a69d8e">room for a comment.</text>
<path d="M716 115 h18 m-7 -7 l7 7 l-7 7" fill="none" stroke="#ff8a4c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="740" y="20" width="210" height="190" rx="12" fill="#1e1b16" stroke="#3a352c" stroke-width="1.5"/>
<text x="758" y="54" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#ff8a4c">04</text>
<text x="758" y="94" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#efe8dc">Paste it</text><text x="758" y="126" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#efe8dc">back</text>
<text x="758" y="162" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#a69d8e">One Copy button.</text><text x="758" y="186" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#a69d8e">Claude does the rest.</text>
</svg>
